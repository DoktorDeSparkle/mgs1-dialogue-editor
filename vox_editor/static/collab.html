<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Inbox</title>
<link rel="stylesheet" href="style.css">
<style>
  #topbar a { color: var(--muted); }
  #topbar label { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; }
  #cl { flex: 1; display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 0; }
  #plist { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
  #plist .patch { border-bottom: 1px solid var(--line); padding: 8px 0 6px; }
  #plist .phead { padding: 0 10px 4px; display: flex; flex-direction: column; gap: 1px; }
  #plist .phead b { font-size: 12.5px; }
  #plist .phead .note { font-size: 11.5px; color: #b3bccb; white-space: pre-wrap; }
  #plist .perr { padding: 0 10px; color: var(--bad); font-size: 11px; }
  #plist .ent { padding: 4px 10px 4px 16px; cursor: pointer; display: flex; gap: 6px; align-items: center; border-left: 3px solid transparent; }
  #plist .ent:hover { background: var(--panel2); }
  #plist .ent.active { background: var(--sel); border-left-color: var(--accent); }
  #plist .ent .key { font-family: var(--mono); font-size: 12px; }
  .rel { font-size: 10px; padding: 0 6px; border-radius: 8px; border: 1px solid; white-space: nowrap; }
  .rel.new { color: var(--accent); } .rel.update { color: var(--good); } .rel.same { color: var(--muted); } .rel.conflict { color: var(--warn); }
  .res { font-size: 10px; font-family: var(--mono); }
  .res.accept { color: var(--good); } .res.reject { color: var(--bad); }
  #main { overflow: auto; padding: 16px 20px 80px; }
  #main a { color: var(--accent); }
  .empty-inbox { max-width: 560px; margin: 60px auto; color: var(--muted); line-height: 1.6; }
  .empty-inbox h2 { color: var(--text); }
  .drop { outline: 2px dashed var(--accent); outline-offset: -8px; }

  .ehead { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .ehead h2 { margin: 0; font-family: var(--mono); font-size: 16px; font-weight: 500; }
  .ehead .meta { color: var(--muted); font-size: 12px; }
  .ehead .note { white-space: pre-wrap; background: var(--panel2); border-left: 3px solid #a594cf; padding: 6px 10px; border-radius: 4px; }
  .banner { padding: 7px 10px; border-radius: 5px; font-size: 12.5px; border: 1px solid var(--line); }
  .banner.new { border-color: var(--accent-dim); }
  .banner.update { border-color: rgba(88, 194, 138, .5); }
  .banner.conflict, .banner.warn { border-color: rgba(224, 176, 79, .6); background: rgba(224, 176, 79, .07); }
  .banner.bad { border-color: rgba(224, 104, 95, .6); background: rgba(224, 104, 95, .08); }

  table.cmp { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 10px 0 14px; }
  table.cmp th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  table.cmp td { vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.cmp col.no { width: 54px; }
  table.cmp td.no { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  table.cmp td.jp { font-family: var(--jp); font-size: 13px; white-space: pre-wrap; }
  table.cmp td.jp ruby rt { font-size: 9px; color: var(--muted); }
  table.cmp tr.changed td.mine { background: rgba(224, 104, 95, .07); }
  table.cmp tr.changed td.theirs { background: rgba(88, 194, 138, .08); }
  .csub { white-space: pre-wrap; font-size: 13.5px; line-height: 1.4; margin-bottom: 5px; }
  .csub .tm { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .csub.none { color: var(--muted); font-style: italic; font-size: 12px; }
  .chunkmark { font-size: 10px; color: var(--muted); font-family: var(--mono); }

  .acts { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .acts .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .acts textarea { min-height: 48px; resize: vertical; padding: 6px 8px; }
  .acts kbd { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button.accept { border-color: var(--good); background: rgba(88, 194, 138, .15); }
  button.reject { border-color: var(--bad); }
  .resolved { padding: 8px 10px; border-radius: 5px; background: var(--panel2); }
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">Collab inbox</div>
  <div id="counts" class="muted"></div>
  <div class="spacer"></div>
  <label class="muted" title="Recorded with each accept/reject">Reviewer <input id="reviewer" size="12" spellcheck="false"></label>
  <label class="muted"><input type="checkbox" id="history"> show reviewed</label>
  <button id="importBtn" class="primary" title="Import .undub-patch.json files (or drop them on this page)">Import patch…</button>
  <input id="importFile" type="file" accept=".json,application/json" multiple hidden>
  <a id="editorLink" href="/">← editor</a>
</header>
<div id="cl">
  <aside id="plist"></aside>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const DS = new URLSearchParams(location.search).get("ds") || "vox";
const AUTHOR_KEY = "undub-author"; // shared with the editor's Share dialog
let PATCHES = [], sel = null; // sel = {file, key}

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function toast(msg, err = false, ms = 3500) {
  const t = $("#toast");
  t.textContent = msg; t.className = err ? "err" : ""; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}
async function api(path, body) {
  const r = body
    ? await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    : await fetch(path);
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function jpnHtml(raw) { // same as app.js
  let s = esc((raw || "").replace(/‹[A-Z]+›/g, ""));
  s = s.replace(/[#＃]｛([^｝]*)｝[#＃]?/g, (_, inner) => {
    const [base, ...rest] = inner.split("、");
    return rest.length ? `<ruby>${base}<rt>${rest.join("、")}</rt></ruby>` : base;
  });
  return s.replace(/[#＃｛｝]/g, "").replace(/｜/g, "\n").trim();
}
const day = (iso) => (iso || "").replace("T", " ").slice(0, 16);
const reviewer = () => $("#reviewer").value.trim();

const REL = {
  new: ["new", "You have no edits of your own here (at most an MT draft). Accepting adds theirs."],
  update: ["update", "Built on top of the version you have now — they edited what you last merged or sent. Accepting is safe."],
  same: ["identical", "Identical to what you already have."],
  conflict: ["conflict", "You both changed this entry since you last synced. Accepting replaces your version with theirs (yours is kept so you can revert)."],
};

// ------------------------------------------------------------------ list
function entries() { return PATCHES.flatMap((p) => (p.entries || []).map((e) => ({ p, e }))); }
function current() { return sel && entries().find(({ p, e }) => p._file === sel.file && e.key === sel.key); }

function renderList() {
  const box = $("#plist"); box.replaceChildren();
  const pending = entries().filter(({ e }) => !e.resolution).length;
  $("#counts").textContent = `${pending} entr${pending === 1 ? "y" : "ies"} to review`;
  for (const p of PATCHES) {
    box.append(h("div", { class: "patch" },
      h("div", { class: "phead" },
        h("b", {}, `${p.author || "anonymous"} · ${p.dataset}`),
        h("span", { class: "muted small" }, `${day(p.created)} · ${p.entries.length} entr${p.entries.length === 1 ? "y" : "ies"}${p._where === "archive" ? " · reviewed" : ""}`),
        p.note && h("span", { class: "note" }, p.note),
        h("span", { class: "muted small", title: "patch file" }, p._file)),
      p.error && h("div", { class: "perr" }, p.error),
      !p.error && p.entries.map((e) => h("div", {
        class: "ent" + (sel?.file === p._file && sel?.key === e.key ? " active" : ""),
        onclick: () => { sel = { file: p._file, key: e.key }; renderList(); renderMain(); },
      },
        h("span", { class: "key" }, e.key),
        h("span", { class: `rel ${e.assess.relation}` }, REL[e.assess.relation][0]),
        (e.assess.problems.length || e.assess.source_differs) && h("span", { class: "res reject", title: "see warnings" }, "⚠"),
        h("span", { class: "spacer" }),
        e.resolution && h("span", { class: `res ${e.resolution.action}` }, e.resolution.action + "ed")))));
  }
}

// ------------------------------------------------------------------ comparison
// Rows cover runs of JPN lines where both versions have a chunk boundary, so chunking differences line up.
function segments(jpnKeys, a, b) {
  const endsAt = (conv) => {
    const s = new Set();
    for (const c of conv?.chunks || []) s.add(c.lines[c.lines.length - 1]);
    return s;
  };
  const ea = a ? endsAt(a) : null, eb = endsAt(b);
  const segs = []; let run = [];
  for (const k of jpnKeys) {
    run.push(k);
    if (eb.has(k) && (!ea || ea.has(k))) { segs.push(run); run = []; }
  }
  if (run.length) segs.push(run);
  return segs;
}
const subsFor = (conv, lines) => (conv?.chunks || []).filter((c) => c.lines.some((k) => lines.includes(k)));
const subsSig = (chunks) => JSON.stringify(chunks.map((c) => [c.lines, c.subs.map((s) => [s.text.trim(), s.start, s.dur])]));

function subsCell(chunks, cls) {
  const td = h("td", { class: cls });
  const subs = chunks.flatMap((c) => c.subs.filter((s) => s.text.trim()));
  if (!chunks.length || !subs.length) td.append(h("div", { class: "csub none" }, chunks.length ? "no subtitles (keeps JPN)" : "—"));
  if (chunks.length > 1 || chunks.some((c) => c.lines.length > 1))
    td.append(h("div", { class: "chunkmark" }, chunks.map((c) => c.lines.length > 1 ? `[${c.lines[0]}–${c.lines.at(-1)}]` : `[${c.lines[0]}]`).join(" ")));
  for (const s of subs) td.append(h("div", { class: "csub" }, s.text, h("span", { class: "tm" }, `@${s.start} +${s.dur}`)));
  return td;
}

function renderMain() {
  const m = $("#main"); m.replaceChildren();
  const cur = current();
  if (!cur) {
    m.append(h("div", { class: "empty-inbox" },
      h("h2", {}, PATCHES.length ? "Pick an entry on the left" : "Nothing to review"),
      h("p", {}, "When a collaborator sends you a ", h("code", {}, ".undub-patch.json"), " file, import it here (button above, or drop the file on this page). Nothing changes in your editor until you accept an entry."),
      h("p", {}, "To send your own work: in the editor, click ", h("b", {}, "Share…"), ".")));
    return;
  }
  const { p, e } = cur;
  const jpn = e.jpn_local || e.replaces?.jpn;
  const jkeys = Object.keys(jpn?.[0] || {}).sort();
  const local = e.local;
  const rel = REL[e.assess.relation];

  m.append(h("div", { class: "ehead" },
    h("h2", {}, `${p.dataset} · ${e.key}`, " ", h("span", { class: `rel ${e.assess.relation}` }, rel[0])),
    h("div", { class: "meta" }, `from ${p.author || "anonymous"} · exported ${day(p.created)} · imported ${day(p.imported)} · their status: ${e.status || "?"}`),
    p.note && h("div", { class: "note" }, p.note),
    h("div", { class: `banner ${e.assess.relation}` }, rel[1]),
    e.assess.source_differs && h("div", { class: "banner warn" }, "Their copy of the original JPN text for this entry differs from yours (different source extraction?). The JPN column shows yours; check the lines line up."),
    e.assess.problems.map((t) => h("div", { class: "banner bad" }, `Can't merge: ${t}`))));

  const showMine = e.assess.relation !== "new" || local;
  const table = h("table", { class: "cmp" },
    h("colgroup", {}, h("col", { class: "no" }), h("col"), showMine && h("col"), h("col")),
    h("tr", {}, h("th", {}, "line"), h("th", {}, "JPN (being replaced)"), showMine && h("th", {}, "yours now"), h("th", {}, `incoming (${p.author || "theirs"})`)));
  let changed = 0;
  for (const lines of segments(jkeys, showMine ? local : null, e.conv)) {
    const theirs = subsFor(e.conv, lines), mine = subsFor(local, lines);
    const diff = subsSig(theirs) !== subsSig(mine);
    if (diff) changed++;
    table.append(h("tr", { class: diff && showMine ? "changed" : "" },
      h("td", { class: "no" }, lines.length > 1 ? `${lines[0]}–${lines.at(-1)}` : lines[0]),
      h("td", { class: "jp", html: lines.map((k) => jpnHtml(jpn?.[0]?.[k])).join("\n") }),
      showMine && subsCell(mine, "mine"),
      subsCell(theirs, "theirs")));
  }
  if (showMine) m.append(h("div", { class: "muted small" }, changed ? `${changed} row${changed === 1 ? "" : "s"} differ (highlighted)` : "No differences in subtitles or timing."));
  m.append(table);

  const acts = h("div", { class: "acts" });
  const editorHref = `/?ds=${encodeURIComponent(p.dataset)}#${encodeURIComponent(e.key)}`;
  if (e.resolution) {
    const r = e.resolution;
    acts.append(h("div", { class: "resolved" },
      h("b", { class: `res ${r.action}` }, `${r.action}ed`), ` ${day(r.at)}${r.reviewer ? " by " + r.reviewer : ""}`,
      r.note && h("div", { class: "muted" }, `“${r.note}”`)),
      h("div", { class: "row" },
        h("a", { href: editorHref }, "open in editor →"),
        r.action === "accept" && h("button", {
          disabled: !e.assess.revertable, onclick: () => resolve("revert"),
          title: e.assess.revertable ? "Put back the version you had before accepting" : "Edited since accepting — revert by hand in the editor",
        }, "Revert merge"),
        r.action === "reject" && h("button", { onclick: () => resolve("revert"), title: "Move it back to the inbox to review again" }, "Reopen")));
  } else {
    const note = h("textarea", { id: "resNote", placeholder: "Note (optional; kept with the decision)" });
    const blocked = e.assess.problems.length > 0;
    acts.append(note, h("div", { class: "row" },
      h("button", { class: "accept", disabled: blocked, onclick: () => resolve("accept") }, e.assess.relation === "conflict" ? "Accept theirs (replace mine)" : "Accept", h("kbd", {}, "A")),
      h("button", { class: "reject", onclick: () => resolve("reject") }, "Reject", h("kbd", {}, "R")),
      h("span", { class: "spacer" }),
      h("a", { href: editorHref, title: "Your current version" }, "open mine in editor →")));
  }
  m.append(acts);
}

async function resolve(action) {
  const cur = current(); if (!cur) return;
  if (action === "accept" && cur.e.assess.relation === "conflict" &&
      !confirm(`You also changed ${cur.e.key}. Replace your version with ${cur.p.author || "theirs"}'s? (You can revert afterwards.)`)) return;
  try { localStorage.setItem(AUTHOR_KEY, reviewer()); } catch {}
  try {
    const r = await api("/api/collab/resolve", { file: cur.p._file, key: cur.e.key, action, reviewer: reviewer(), note: $("#resNote")?.value.trim() || "" });
    toast(action !== "revert" ? `${cur.e.key}: ${action}ed` : cur.e.resolution.action === "accept" ? `${cur.e.key}: restored your previous version` : `${cur.e.key}: back in the inbox`);
    sel = { file: r.file, key: cur.e.key };
    await load();
    if (action !== "revert") nextPending();
  } catch (e) { toast(e.message, true, 8000); }
}

function nextPending() {
  const all = entries(), i = all.findIndex(({ p, e }) => p._file === sel?.file && e.key === sel?.key);
  const next = [...all.slice(i + 1), ...all.slice(0, Math.max(0, i))].find(({ e }) => !e.resolution);
  if (next) { sel = { file: next.p._file, key: next.e.key }; renderList(); renderMain(); }
}

// ------------------------------------------------------------------ import
async function importFiles(files) {
  let ok = 0;
  for (const f of files) {
    try {
      const r = await api("/api/collab/import", { filename: f.name, patch: JSON.parse(await f.text()) });
      if (r.duplicate) toast(`${f.name} was already imported (${r.where}/${r.file})`, false, 5000);
      else ok++;
    } catch (e) { toast(`${f.name}: ${e.message}`, true, 8000); }
  }
  if (ok) toast(`Imported ${ok} patch${ok === 1 ? "" : "es"}`);
  await load();
  if (!current()) nextPending();
}

async function load() {
  const r = await api(`/api/collab/inbox?history=${$("#history").checked ? 1 : 0}`);
  PATCHES = r.patches;
  if (!current()) sel = null;
  renderList(); renderMain();
}

(function main() {
  try { $("#reviewer").value = localStorage.getItem(AUTHOR_KEY) || ""; } catch {}
  $("#editorLink").href = `/?ds=${encodeURIComponent(DS)}`;
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = (ev) => { importFiles([...ev.target.files]); ev.target.value = ""; };
  $("#history").onchange = load;
  document.addEventListener("dragover", (ev) => { ev.preventDefault(); document.body.classList.add("drop"); });
  document.addEventListener("dragleave", (ev) => { if (!ev.relatedTarget) document.body.classList.remove("drop"); });
  document.addEventListener("drop", (ev) => { ev.preventDefault(); document.body.classList.remove("drop"); importFiles([...ev.dataTransfer.files]); });
  document.addEventListener("keydown", (ev) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const cur = current(); if (!cur || cur.e.resolution) return;
    if (ev.key.toLowerCase() === "a" && !cur.e.assess.problems.length) resolve("accept");
    else if (ev.key.toLowerCase() === "r") resolve("reject");
  });
  load().then(() => { if (!current()) nextPending(); }).catch((e) => toast("Failed to load: " + e.message, true, 60000));
})();
</script>
</body>
</html>
